<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparto Router</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f5f7;
            color: #1a1a1a;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 60px);
        }

        .sidebar {
            background: white;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 16px;
        }

        .sidebar h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            margin-bottom: 12px;
        }

        #rutas-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ruta-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .ruta-item:hover {
            border-color: #1e3a5f;
            background: #f0f4f8;
        }

        .ruta-item.activa {
            border-color: #1e3a5f;
            background: #e8f0fb;
        }

        .ruta-item .ruta-hora {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .ruta-item .ruta-meta {
            font-size: 0.8rem;
            color: #777;
            margin-top: 4px;
        }

        .ruta-item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .btn-eliminar-ruta {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.4;
            padding: 2px 4px;
            border-radius: 4px;
            transition: opacity 0.15s ease, background 0.15s ease;
            flex-shrink: 0;
        }

        .btn-eliminar-ruta:hover {
            opacity: 1;
            background: #fdecea;
        }

        #paradas-lista {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .parada-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.85rem;
        }

        .parada-numero {
            display: inline-block;
            background: #1e3a5f;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            width: 18px;
            height: 18px;
            line-height: 18px;
            text-align: center;
            border-radius: 50%;
            margin-right: 6px;
        }

        .sin-geocodificar {
            margin-left: 6px;
            color: #e67e22;
        }

        .btn-eliminar-parada {
            background: none;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.4;
            padding: 2px 4px;
            border-radius: 4px;
            transition: opacity 0.15s ease, background 0.15s ease;
        }

        .btn-eliminar-parada:hover {
            opacity: 1;
            background: #fdecea;
        }

        .sin-paradas {
            font-size: 0.85rem;
            color: #999;
            font-style: italic;
        }

        #estado {
            font-size: 0.85rem;
            color: #999;
            padding: 12px 0;
        }

        #mapa {
            height: 100%;
            width: 100%;
        }

        .error {
            color: #c0392b;
            font-size: 0.85rem;
            padding: 8px 0;
        }

        .btn-header {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-header:hover {
            background: #27ae60;
        }

        #panel-parada {
            border-top: 1px solid #e0e0e0;
            padding-top: 16px;
        }

        #form-parada {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #form-parada label {
            font-size: 0.78rem;
            font-weight: 600;
            color: #555;
            margin-top: 8px;
        }

        #form-parada input {
            padding: 8px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        #form-parada input:focus {
            outline: none;
            border-color: #1e3a5f;
        }

        .btn-primary {
            margin-top: 14px;
            background: #1e3a5f;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #16304d;
        }

        .btn-primary:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #parada-mensaje {
            font-size: 0.82rem;
            margin-top: 10px;
        }

        .mensaje-ok {
            color: #27ae60;
        }
    </style>
</head>
<body>

<header>
    <h1>🚚 Reparto Router</h1>
    <button id="btn-nueva-ruta" class="btn-header">+ Nueva ruta</button>
</header>

<div class="layout">
    <aside class="sidebar">
        <h2>Rutas</h2>
        <div id="estado">Cargando rutas...</div>
        <div id="rutas-lista"></div>

        <div id="panel-parada" style="display:none;">
            <h2 style="margin-top:20px;">Paradas de esta ruta</h2>
            <div id="paradas-lista"></div>

            <h2 style="margin-top:20px;">Añadir parada</h2>
            <form id="form-parada">
                <label>Nombre</label>
                <input type="text" id="p-nombre" required>

                <label>Calle y número</label>
                <input type="text" id="p-calle" required>

                <label>Código postal</label>
                <input type="text" id="p-codigoPostal" required>

                <label>Población</label>
                <input type="text" id="p-poblacion" required>

                <label>Hora apertura</label>
                <input type="time" id="p-horaApertura" value="09:00">

                <label>Hora cierre</label>
                <input type="time" id="p-horaCierre" value="18:00">

                <button type="submit" class="btn-primary">Añadir parada</button>
            </form>
            <div id="parada-mensaje"></div>
        </div>
    </aside>

    <main id="mapa"></main>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const API_BASE = 'http://localhost:8080/api';

    // Inicializar mapa centrado en Móstoles, Madrid
    const mapa = L.map('mapa').setView([40.3227, -3.8649], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(mapa);

    let marcadoresActuales = [];
    let rutaActivaId = null;

    function limpiarMarcadores() {
        marcadoresActuales.forEach(m => mapa.removeLayer(m));
        marcadoresActuales = [];
    }

    function renderizarListaParadas(paradas) {
        const contenedor = document.getElementById('paradas-lista');

        if (paradas.length === 0) {
            contenedor.innerHTML = '<p class="sin-paradas">Todavía no hay paradas.</p>';
            return;
        }

        contenedor.innerHTML = '';

        paradas.forEach(parada => {
            const item = document.createElement('div');
            item.className = 'parada-item';
            item.innerHTML = `
                <div>
                    <span class="parada-numero">#${parada.numero}</span>
                    <span class="parada-nombre">${parada.nombre}</span>
                    ${(parada.latitud === 0 && parada.longitud === 0) ? '<span class="sin-geocodificar" title="Sin coordenadas">⚠</span>' : ''}
                </div>
                <button class="btn-eliminar-parada" title="Eliminar parada" data-id="${parada.id}">🗑</button>
            `;
            item.querySelector('.btn-eliminar-parada').addEventListener('click', () => {
                eliminarParada(parada.id, parada.nombre);
            });
            contenedor.appendChild(item);
        });
    }

    async function eliminarParada(paradaId, nombreParada) {
        const confirmado = confirm(`¿Eliminar la parada "${nombreParada}"?`);
        if (!confirmado) return;

        try {
            const resp = await fetch(`${API_BASE}/rutas/${rutaActivaId}/paradas/${paradaId}`, {
                method: 'DELETE'
            });
            if (!resp.ok) throw new Error('No se pudo eliminar la parada');

            await cargarParadasDeRuta(rutaActivaId);
            await cargarRutas();
        } catch (err) {
            alert('Error al eliminar la parada: ' + err.message);
        }
    }

    function pintarParadas(paradas) {
        limpiarMarcadores();

        const paradasConCoordenadas = paradas.filter(p => p.latitud !== 0 || p.longitud !== 0);

        if (paradasConCoordenadas.length === 0) {
            return { conCoordenadas: 0, total: paradas.length };
        }

        const bounds = [];

        paradasConCoordenadas.forEach(parada => {
            const marker = L.marker([parada.latitud, parada.longitud])
                .addTo(mapa)
                .bindPopup(`
                    <strong>#${parada.numero} - ${parada.nombre}</strong><br>
                    ${parada.direccion || parada.calle}<br>
                    ${parada.horaApertura || ''} - ${parada.horaCierre || ''}
                `);
            marcadoresActuales.push(marker);
            bounds.push([parada.latitud, parada.longitud]);
        });

        mapa.fitBounds(bounds, { padding: [40, 40] });

        return { conCoordenadas: paradasConCoordenadas.length, total: paradas.length };
    }

    async function cargarParadasDeRuta(rutaId) {
        try {
            const resp = await fetch(`${API_BASE}/rutas/${rutaId}/paradas`);
            if (!resp.ok) throw new Error('Error al obtener paradas');
            const paradas = await resp.json();
            const resultado = pintarParadas(paradas);
            renderizarListaParadas(paradas);

            if (resultado.total === 0) {
                document.getElementById('estado').textContent = 'Esta ruta no tiene paradas todavía.';
            } else if (resultado.conCoordenadas === 0) {
                document.getElementById('estado').innerHTML =
                    `<span class="error">${resultado.total} parada(s) en esta ruta, pero ninguna tiene coordenadas asignadas (falta geocodificar).</span>`;
            } else if (resultado.conCoordenadas < resultado.total) {
                document.getElementById('estado').innerHTML =
                    `<span class="error">${resultado.conCoordenadas} de ${resultado.total} parada(s) mostradas (el resto no tiene coordenadas).</span>`;
            } else {
                document.getElementById('estado').textContent =
                    `${resultado.total} parada(s) en esta ruta`;
            }
        } catch (err) {
            document.getElementById('estado').innerHTML =
                `<span class="error">Error al cargar paradas: ${err.message}</span>`;
        }
    }

    function marcarRutaActiva(elemento, rutaId) {
        document.querySelectorAll('.ruta-item').forEach(el => el.classList.remove('activa'));
        elemento.classList.add('activa');
        rutaActivaId = rutaId;
        document.getElementById('panel-parada').style.display = 'block';
        document.getElementById('parada-mensaje').innerHTML = '';
    }

    async function eliminarRuta(rutaId, nombreRuta) {
        const confirmado = confirm(`¿Seguro que quieres eliminar "${nombreRuta}"? Esta acción no se puede deshacer y borrará también sus paradas.`);
        if (!confirmado) return;

        try {
            const resp = await fetch(`${API_BASE}/rutas/${rutaId}`, { method: 'DELETE' });
            if (!resp.ok) throw new Error('No se pudo eliminar la ruta');

            if (rutaActivaId === rutaId) {
                rutaActivaId = null;
                document.getElementById('panel-parada').style.display = 'none';
                limpiarMarcadores();
            }

            await cargarRutas();
        } catch (err) {
            alert('Error al eliminar la ruta: ' + err.message);
        }
    }

    async function cargarRutas() {
        const contenedor = document.getElementById('rutas-lista');
        const estado = document.getElementById('estado');

        try {
            const resp = await fetch(`${API_BASE}/rutas`);
            if (!resp.ok) throw new Error('Error al obtener rutas');
            const rutas = await resp.json();

            if (rutas.length === 0) {
                estado.textContent = 'No hay rutas creadas todavía.';
                return;
            }

            estado.textContent = `${rutas.length} ruta(s) encontradas`;
            contenedor.innerHTML = '';

            rutas.forEach(ruta => {
                const item = document.createElement('div');
                item.className = 'ruta-item';
                item.innerHTML = `
                    <div class="ruta-item-top">
                        <div>
                            <div class="ruta-hora">${ruta.nombre || ('Ruta #' + ruta.id)}</div>
                            <div class="ruta-meta">${ruta.horaInicio || 'sin hora'} · ${ruta.paradasOrdenadas ? ruta.paradasOrdenadas.length : 0} parada(s) · ${ruta.distanciaTotalKm} km</div>
                        </div>
                        <button class="btn-eliminar-ruta" title="Eliminar ruta" data-id="${ruta.id}">🗑</button>
                    </div>
                `;

                item.querySelector('.btn-eliminar-ruta').addEventListener('click', (e) => {
                    e.stopPropagation(); // evita que también se seleccione la ruta al pulsar el botón
                    eliminarRuta(ruta.id, ruta.nombre || ('Ruta #' + ruta.id));
                });
                item.addEventListener('click', () => {
                    marcarRutaActiva(item, ruta.id);
                    cargarParadasDeRuta(ruta.id);
                });
                contenedor.appendChild(item);

                if (ruta.id === rutaActivaId) {
                    item.classList.add('activa');
                }
            });

            if (rutaActivaId && contenedor.querySelector('.ruta-item.activa')) {
                // Ya hay una ruta activa preservada tras la recarga, no hace falta hacer nada más
            } else {
                contenedor.firstChild.click();
            }

        } catch (err) {
            estado.innerHTML = `<span class="error">Error al cargar rutas: ${err.message}. ¿Está el servidor corriendo en localhost:8080?</span>`;
        }
    }

    // ─── Crear nueva ruta ─────────────────────────────────────────────
    document.getElementById('btn-nueva-ruta').addEventListener('click', async () => {
        const nombre = prompt('Nombre de la ruta (ej: Chofer 1):');
        if (!nombre) return;

        const horaInicio = prompt('Hora de inicio de la ruta (formato HH:MM):', '08:00');
        if (!horaInicio) return;

        try {
            const resp = await fetch(`${API_BASE}/rutas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: nombre, horaInicio: horaInicio + ':00' })
            });
            if (!resp.ok) throw new Error('No se pudo crear la ruta');
            await cargarRutas();
        } catch (err) {
            alert('Error al crear la ruta: ' + err.message);
        }
    });

    // ─── Añadir parada a la ruta activa ──────────────────────────────
    document.getElementById('form-parada').addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!rutaActivaId) {
            alert('Selecciona una ruta primero.');
            return;
        }

        const boton = e.target.querySelector('button[type="submit"]');
        const mensaje = document.getElementById('parada-mensaje');

        const datos = {
            nombre: document.getElementById('p-nombre').value,
            calle: document.getElementById('p-calle').value,
            codigoPostal: document.getElementById('p-codigoPostal').value,
            poblacion: document.getElementById('p-poblacion').value,
            horaApertura: document.getElementById('p-horaApertura').value + ':00',
            horaCierre: document.getElementById('p-horaCierre').value + ':00'
        };

        boton.disabled = true;
        boton.textContent = 'Geocodificando dirección...';
        mensaje.innerHTML = '';

        try {
            const resp = await fetch(`${API_BASE}/rutas/${rutaActivaId}/paradas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            if (!resp.ok) throw new Error('El servidor rechazó la petición');

            const paradaCreada = await resp.json();

            if (paradaCreada.latitud === 0 && paradaCreada.longitud === 0) {
                mensaje.innerHTML = '<span class="error">Parada guardada, pero no se encontraron coordenadas para esa dirección.</span>';
            } else {
                mensaje.innerHTML = '<span class="mensaje-ok">✓ Parada añadida y geocodificada correctamente.</span>';
            }

            e.target.reset();
            document.getElementById('p-horaApertura').value = '09:00';
            document.getElementById('p-horaCierre').value = '18:00';

            await cargarParadasDeRuta(rutaActivaId);
            await cargarRutas(); // refresca el contador de paradas en el sidebar

        } catch (err) {
            mensaje.innerHTML = `<span class="error">Error: ${err.message}</span>`;
        } finally {
            boton.disabled = false;
            boton.textContent = 'Añadir parada';
        }
    });

    cargarRutas();
</script>

</body>
</html>
