<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparto Router</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f5f7;
            color: #1a1a1a;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 60px);
        }

        .sidebar {
            background: white;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 16px;
        }

        .sidebar h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            margin-bottom: 12px;
        }

        #rutas-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ruta-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .ruta-item:hover {
            border-color: #1e3a5f;
            background: #f0f4f8;
        }

        .ruta-item.activa {
            border-color: #1e3a5f;
            background: #e8f0fb;
        }

        .ruta-item .ruta-hora {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .ruta-item .ruta-meta {
            font-size: 0.8rem;
            color: #777;
            margin-top: 4px;
        }

        #estado {
            font-size: 0.85rem;
            color: #999;
            padding: 12px 0;
        }

        #mapa {
            height: 100%;
            width: 100%;
        }

        .error {
            color: #c0392b;
            font-size: 0.85rem;
            padding: 8px 0;
        }
    </style>
</head>
<body>

<header>
    <h1>🚚 Reparto Router</h1>
</header>

<div class="layout">
    <aside class="sidebar">
        <h2>Rutas</h2>
        <div id="estado">Cargando rutas...</div>
        <div id="rutas-lista"></div>
    </aside>

    <main id="mapa"></main>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const API_BASE = 'http://localhost:8080/api';

    // Inicializar mapa centrado en Móstoles, Madrid
    const mapa = L.map('mapa').setView([40.3227, -3.8649], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(mapa);

    let marcadoresActuales = [];

    function limpiarMarcadores() {
        marcadoresActuales.forEach(m => mapa.removeLayer(m));
        marcadoresActuales = [];
    }

    function pintarParadas(paradas) {
        limpiarMarcadores();

        const paradasConCoordenadas = paradas.filter(p => p.latitud !== 0 || p.longitud !== 0);

        if (paradasConCoordenadas.length === 0) {
            return { conCoordenadas: 0, total: paradas.length };
        }

        const bounds = [];

        paradasConCoordenadas.forEach(parada => {
            const marker = L.marker([parada.latitud, parada.longitud])
                .addTo(mapa)
                .bindPopup(`
                    <strong>#${parada.numero} - ${parada.nombre}</strong><br>
                    ${parada.direccion || parada.calle}<br>
                    ${parada.horaApertura || ''} - ${parada.horaCierre || ''}
                `);
            marcadoresActuales.push(marker);
            bounds.push([parada.latitud, parada.longitud]);
        });

        mapa.fitBounds(bounds, { padding: [40, 40] });

        return { conCoordenadas: paradasConCoordenadas.length, total: paradas.length };
    }

    async function cargarParadasDeRuta(rutaId) {
        try {
            const resp = await fetch(`${API_BASE}/rutas/${rutaId}/paradas`);
            if (!resp.ok) throw new Error('Error al obtener paradas');
            const paradas = await resp.json();
            const resultado = pintarParadas(paradas);

            if (resultado.total === 0) {
                document.getElementById('estado').textContent = 'Esta ruta no tiene paradas todavía.';
            } else if (resultado.conCoordenadas === 0) {
                document.getElementById('estado').innerHTML =
                    `<span class="error">${resultado.total} parada(s) en esta ruta, pero ninguna tiene coordenadas asignadas (falta geocodificar).</span>`;
            } else if (resultado.conCoordenadas < resultado.total) {
                document.getElementById('estado').innerHTML =
                    `<span class="error">${resultado.conCoordenadas} de ${resultado.total} parada(s) mostradas (el resto no tiene coordenadas).</span>`;
            } else {
                document.getElementById('estado').textContent =
                    `${resultado.total} parada(s) en esta ruta`;
            }
        } catch (err) {
            document.getElementById('estado').innerHTML =
                `<span class="error">Error al cargar paradas: ${err.message}</span>`;
        }
    }

    function marcarRutaActiva(elemento) {
        document.querySelectorAll('.ruta-item').forEach(el => el.classList.remove('activa'));
        elemento.classList.add('activa');
    }

    async function cargarRutas() {
        const contenedor = document.getElementById('rutas-lista');
        const estado = document.getElementById('estado');

        try {
            const resp = await fetch(`${API_BASE}/rutas`);
            if (!resp.ok) throw new Error('Error al obtener rutas');
            const rutas = await resp.json();

            if (rutas.length === 0) {
                estado.textContent = 'No hay rutas creadas todavía.';
                return;
            }

            estado.textContent = `${rutas.length} ruta(s) encontradas`;
            contenedor.innerHTML = '';

            rutas.forEach(ruta => {
                const item = document.createElement('div');
                item.className = 'ruta-item';
                item.innerHTML = `
                    <div class="ruta-hora">Ruta #${ruta.id} - ${ruta.horaInicio || 'sin hora'}</div>
                    <div class="ruta-meta">${ruta.paradasOrdenadas ? ruta.paradasOrdenadas.length : 0} parada(s) · ${ruta.distanciaTotalKm} km</div>
                `;
                item.addEventListener('click', () => {
                    marcarRutaActiva(item);
                    cargarParadasDeRuta(ruta.id);
                });
                contenedor.appendChild(item);
            });

            // Cargar automáticamente la primera ruta
            contenedor.firstChild.click();

        } catch (err) {
            estado.innerHTML = `<span class="error">Error al cargar rutas: ${err.message}. ¿Está el servidor corriendo en localhost:8080?</span>`;
        }
    }

    cargarRutas();
</script>

</body>
</html>
